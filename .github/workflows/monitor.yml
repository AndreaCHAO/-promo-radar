name: 每日监测与新活动发现

on:
  schedule:
    - cron: "17 0 * * *"   # 每天 UTC 00:17 = 吉隆坡时间 08:17
  workflow_dispatch: {}     # 也可以在 Actions 页面手动点 Run workflow

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 发现新活动 + 复查来源
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_MAX_RECORDS: ${{ vars.AI_MAX_RECORDS }}
          DISCOVERY_MAX_NEW: ${{ vars.DISCOVERY_MAX_NEW }}
          DISCOVERY_LOOKBACK_DAYS: ${{ vars.DISCOVERY_LOOKBACK_DAYS }}
        run: |
          python monitor/discover.py
          python monitor/monitor.py
          python monitor/make_site.py
      - name: 保存结果（网页会自动重新发布）
        run: |
          git config user.name "promo-radar-bot"
          git config user.email "promo-radar-bot@users.noreply.github.com"
          git add data/monitor.json data/auto_records.csv data/discovery.json monitor/snapshots index.html
          if git diff --cached --quiet; then echo "没有变化"; else git commit -m "每日监测 $(date -u +%F)" && git push; fi
